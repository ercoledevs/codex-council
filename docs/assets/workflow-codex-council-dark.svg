<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            :root {
                --bg: #0a100e;
                --surface: #18221e;
                --text-main: #e9f1ed;
                --text-muted: #8da097;
                --primary: #36d9b0;
                --accent: #d8a544;
                --danger: #e98570;
                --bg-alt: #0f1814;
            }
            .bg { fill: var(--bg); }
            .bg-alt { fill: var(--bg-alt); }
            .surface { fill: var(--surface); filter: drop-shadow(0 12px 24px rgba(17, 21, 18, 0.06)); }
            .surface-flat { fill: var(--surface); }
            
            .border { stroke: var(--text-muted); stroke-width: 1.5; opacity: 0.2; }
            .border-dash { stroke: var(--text-muted); stroke-width: 1.5; opacity: 0.3; stroke-dasharray: 4 6; fill: none; }
            
            .text-line-dark { fill: var(--text-main); }
            .text-line { fill: var(--text-muted); opacity: 0.4; }
            
            .connector { stroke: var(--text-muted); stroke-width: 2; fill: none; opacity: 0.5; stroke-linejoin: round; }
            .connector-active { stroke: var(--primary); stroke-width: 2.5; fill: none; stroke-linejoin: round; }
            
            .icon { fill: none; stroke: var(--text-main); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
            .icon-primary { fill: none; stroke: var(--primary); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
            .icon-muted { fill: none; stroke: var(--text-muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
            .icon-warn { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
            
            .accent-fill { fill: var(--accent); opacity: 0.15; }
            .danger-fill { fill: var(--danger); opacity: 0.12; }
            .primary-fill { fill: var(--primary); opacity: 0.12; }
            .muted-fill { fill: var(--text-muted); opacity: 0.12; }

            .stage-label { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; fill: var(--text-muted); opacity: 0.8; }
            .card-label { font-family: monospace, system-ui, sans-serif; font-size: 24px; font-weight: 700; fill: var(--text-main); }
        </style>

        <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#8da097" opacity="0.5"/>
        </marker>
        <marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#36d9b0"/>
        </marker>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
        </filter>
    </defs>

    <!-- Zone Backgrounds -->
    <rect x="0" y="0" width="400" height="900" class="bg"/>
    <rect x="400" y="0" width="400" height="900" class="bg-alt"/>
    <rect x="800" y="0" width="400" height="900" class="bg"/>
    <rect x="1200" y="0" width="400" height="900" class="bg-alt"/>

    <!-- Zone Separators -->
    <line x1="400" y1="0" x2="400" y2="900" class="border" stroke-dasharray="4 8"/>
    <line x1="800" y1="0" x2="800" y2="900" class="border" stroke-dasharray="4 8"/>
    <line x1="1200" y1="0" x2="1200" y2="900" class="border" stroke-dasharray="4 8"/>

    <!-- Stage Labels -->
    <text x="200" y="80" text-anchor="middle" class="stage-label">Prompt</text>
    <text x="600" y="80" text-anchor="middle" class="stage-label">Council</text>
    <text x="1000" y="80" text-anchor="middle" class="stage-label">Review</text>
    <text x="1400" y="80" text-anchor="middle" class="stage-label">Synthesis</text>

    <!-- CONNECTIONS & ROUTING -->
    <g id="workflow-connectors">
        <!-- Prompt to Council Tree -->
        <path d="M 280 450 H 380 V 350 H 456" class="connector-active" marker-end="url(#arrow-active)"/>
        <path d="M 380 450 V 550 H 456" class="connector" marker-end="url(#arrow-muted)"/>
        
        <!-- Council Row 1 Links -->
        <line x1="504" y1="350" x2="556" y2="350" class="connector-active" marker-end="url(#arrow-active)"/>
        <line x1="604" y1="350" x2="656" y2="350" class="connector-active" marker-end="url(#arrow-active)"/>
        
        <!-- Council Row 2 Links -->
        <line x1="504" y1="550" x2="556" y2="550" class="connector" marker-end="url(#arrow-muted)"/>
        <line x1="604" y1="550" x2="656" y2="550" class="connector" marker-end="url(#arrow-muted)"/>
        
        <!-- Council to Review Pool -->
        <path d="M 704 350 H 760 V 450 H 836" class="connector-active" marker-end="url(#arrow-active)"/>
        <path d="M 704 550 H 760" class="connector"/>

        <!-- Pool to Scoring & Reviewers -->
        <path d="M 1004 340 H 1040" class="connector" marker-end="url(#arrow-muted)"/>
        <path d="M 1004 500 H 1040" class="connector" marker-end="url(#arrow-muted)"/>

        <!-- Scoring & Reviewers to Synthesis -->
        <path d="M 1170 340 H 1220 V 450 H 1266" class="connector-active" marker-end="url(#arrow-active)"/>
        <path d="M 1170 500 H 1220 V 450" class="connector"/>
    </g>

    <!-- ZONE 1: PROMPT INTAKE -->
    <g id="zone-1-prompt">
        <rect x="80" y="300" width="200" height="300" rx="12" class="surface"/>
        
        <!-- Input Marker / Pulse -->
        <circle cx="60" cy="450" r="16" class="surface-flat" filter="url(#shadow)"/>
        <circle cx="60" cy="450" r="6" fill="var(--primary)"/>
        <path d="M 60 450 H 80" class="icon-primary" stroke-width="2"/>

        <!-- Abstract Code Lines -->
        <rect x="100" y="320" width="60" height="12" rx="4" class="text-line-dark"/>
        <rect x="100" y="350" width="140" height="8" rx="4" class="text-line"/>
        <rect x="100" y="370" width="160" height="8" rx="4" class="text-line"/>
        <rect x="100" y="390" width="120" height="8" rx="4" class="text-line"/>
        
        <rect x="100" y="430" width="80" height="10" rx="4" class="text-line-dark"/>
        <rect x="100" y="460" width="150" height="8" rx="4" class="text-line"/>
        <rect x="100" y="480" width="130" height="8" rx="4" class="text-line"/>
        <rect x="100" y="500" width="140" height="8" rx="4" class="text-line"/>
        
        <rect x="100" y="540" width="50" height="16" rx="4" class="primary-fill"/>
        <rect x="105" y="545" width="40" height="6" rx="2" fill="var(--primary)"/>
    </g>

    <!-- ZONE 2: COUNCIL NODES -->
    <g id="zone-2-council">
        <!-- Node 1: Architecture -->
        <g transform="translate(480, 350)">
            <circle cx="0" cy="0" r="32" class="surface"/>
            <circle cx="0" cy="0" r="26" class="border"/>
            <rect x="-12" y="-12" width="10" height="10" class="icon" rx="2"/>
            <rect x="2" y="-12" width="10" height="10" class="icon" rx="2"/>
            <rect x="-12" y="2" width="10" height="10" class="icon" rx="2"/>
            <rect x="2" y="2" width="10" height="10" class="icon" rx="2"/>
        </g>

        <!-- Node 2: Reliability -->
        <g transform="translate(580, 350)">
            <circle cx="0" cy="0" r="32" class="surface"/>
            <circle cx="0" cy="0" r="26" class="border"/>
            <polyline points="-14,0 -6,0 -2,-8 4,8 8,0 14,0" class="icon-primary"/>
        </g>

        <!-- Node 3: Security -->
        <g transform="translate(680, 350)">
            <circle cx="0" cy="0" r="32" class="surface"/>
            <circle cx="0" cy="0" r="26" class="border"/>
            <path d="M 0,-14 L 12,-8 V 2 C 12,10 0,16 0,16 C 0,16 -12,10 -12,2 V -8 Z" class="icon"/>
        </g>

        <!-- Node 4: Product Signals -->
        <g transform="translate(480, 550)">
            <circle cx="0" cy="0" r="32" class="surface"/>
            <circle cx="0" cy="0" r="26" class="border"/>
            <rect x="-10" y="-2" width="4" height="12" class="icon-muted" rx="1"/>
            <rect x="-2" y="-8" width="4" height="18" class="icon-muted" rx="1"/>
            <rect x="6" y="-14" width="4" height="24" class="icon-muted" rx="1"/>
        </g>

        <!-- Node 5: Red-team Warning -->
        <g transform="translate(580, 550)">
            <circle cx="0" cy="0" r="32" class="surface"/>
            <circle cx="0" cy="0" r="26" class="border"/>
            <polygon points="0,-12 -12,10 12,10" class="icon-warn"/>
            <line x1="0" y1="-4" x2="0" y2="4" class="icon-warn"/>
            <circle cx="0" cy="8" r="1.5" fill="var(--accent)"/>
        </g>

        <!-- Node 6: Performance -->
        <g transform="translate(680, 550)">
            <circle cx="0" cy="0" r="32" class="surface"/>
            <circle cx="0" cy="0" r="26" class="border"/>
            <path d="M -12,-4 H 4 L -2,6 H 12" class="icon-muted"/>
            <line x1="-14" y1="2" x2="-8" y2="2" class="icon-muted"/>
        </g>
    </g>

    <!-- ZONE 3: REVIEW & SCORING -->
    <g id="zone-3-review">
        <!-- Candidate Pool Container -->
        <rect x="844" y="260" width="160" height="380" rx="16" class="border-dash"/>
        
        <!-- Candidate Cards -->
        <g transform="translate(860, 280)">
            <rect x="0" y="0" width="56" height="76" rx="8" class="surface"/>
            <text x="28" y="46" text-anchor="middle" class="card-label">A</text>
            <rect x="18" y="62" width="20" height="4" rx="2" fill="var(--primary)"/>
        </g>
        <g transform="translate(932, 280)">
            <rect x="0" y="0" width="56" height="76" rx="8" class="surface"/>
            <text x="28" y="46" text-anchor="middle" class="card-label">B</text>
            <rect x="18" y="62" width="20" height="4" rx="2" class="muted-fill"/>
        </g>
        
        <g transform="translate(860, 390)">
            <rect x="0" y="0" width="56" height="76" rx="8" class="surface"/>
            <text x="28" y="46" text-anchor="middle" class="card-label">C</text>
            <rect x="18" y="62" width="20" height="4" rx="2" class="muted-fill"/>
        </g>
        <g transform="translate(932, 390)">
            <rect x="0" y="0" width="56" height="76" rx="8" class="surface"/>
            <text x="28" y="46" text-anchor="middle" class="card-label">D</text>
            <rect x="18" y="62" width="20" height="4" rx="2" class="muted-fill"/>
        </g>

        <g transform="translate(860, 500)">
            <rect x="0" y="0" width="56" height="76" rx="8" class="surface"/>
            <text x="28" y="46" text-anchor="middle" class="card-label">E</text>
            <rect x="18" y="62" width="20" height="4" rx="2" class="accent-fill"/>
        </g>
        <g transform="translate(932, 500)">
            <rect x="0" y="0" width="56" height="76" rx="8" class="surface"/>
            <text x="28" y="46" text-anchor="middle" class="card-label">F</text>
            <rect x="18" y="62" width="20" height="4" rx="2" class="muted-fill"/>
        </g>

        <!-- Compact Scoring Grid -->
        <g transform="translate(1048, 280)">
            <rect x="0" y="0" width="120" height="120" rx="8" class="surface"/>
            <line x1="16" y1="40" x2="104" y2="40" class="border"/>
            <line x1="16" y1="80" x2="104" y2="80" class="border"/>
            <line x1="40" y1="16" x2="40" y2="104" class="border"/>
            <line x1="80" y1="16" x2="80" y2="104" class="border"/>
            
            <circle cx="28" cy="28" r="4" fill="var(--primary)"/>
            <circle cx="60" cy="60" r="4" fill="var(--accent)"/>
            <circle cx="92" cy="28" r="4" fill="var(--text-muted)"/>
            <circle cx="28" cy="92" r="4" fill="var(--text-muted)"/>
            <circle cx="92" cy="92" r="4" fill="var(--danger)"/>
        </g>

        <!-- Reviewer Cards -->
        <g transform="translate(1048, 440)">
            <rect x="0" y="0" width="120" height="48" rx="24" class="surface"/>
            <circle cx="24" cy="24" r="14" class="bg-alt"/>
            <circle cx="24" cy="20" r="4" fill="var(--text-muted)"/>
            <path d="M 16 32 C 16 28 32 28 32 32" fill="none" stroke="var(--text-muted)" stroke-width="2"/>
            <rect x="48" y="20" width="50" height="8" rx="4" class="text-line-dark"/>
        </g>
        
        <g transform="translate(1048, 504)">
            <rect x="0" y="0" width="120" height="48" rx="24" class="surface"/>
            <circle cx="24" cy="24" r="14" class="bg-alt"/>
            <circle cx="24" cy="20" r="4" fill="var(--text-muted)"/>
            <path d="M 16 32 C 16 28 32 28 32 32" fill="none" stroke="var(--text-muted)" stroke-width="2"/>
            <rect x="48" y="20" width="40" height="8" rx="4" class="text-line-dark"/>
        </g>
    </g>

    <!-- ZONE 4: SYNTHESIS -->
    <g id="zone-4-synthesis">
        <rect x="1280" y="280" width="240" height="340" rx="12" class="surface"/>
        
        <!-- Top Ribbon -->
        <path d="M 1480 280 L 1500 280 A 12 12 0 0 1 1520 292 L 1520 310 L 1500 300 L 1480 310 Z" fill="var(--primary)"/>

        <!-- Header -->
        <rect x="1304" y="304" width="80" height="12" rx="4" class="text-line-dark"/>
        <rect x="1304" y="324" width="140" height="6" rx="3" class="text-line"/>
        
        <!-- Marker 1: Check (Selected Recommendation) -->
        <g transform="translate(1300, 360)">
            <rect x="0" y="0" width="200" height="60" rx="8" class="bg"/>
            <circle cx="30" cy="30" r="16" class="primary-fill"/>
            <polyline points="24,30 28,34 36,26" class="icon-primary" stroke-width="2"/>
            <rect x="60" y="20" width="100" height="8" rx="4" class="text-line-dark"/>
            <rect x="60" y="36" width="60" height="6" rx="3" class="text-line"/>
        </g>

        <!-- Marker 2: Dissent -->
        <g transform="translate(1300, 436)">
            <rect x="0" y="0" width="200" height="60" rx="8" class="bg"/>
            <circle cx="30" cy="30" r="16" class="warn-fill"/>
            <line x1="26" y1="26" x2="34" y2="34" class="icon-warn" stroke-width="2"/>
            <line x1="34" y1="26" x2="26" y2="34" class="icon-warn" stroke-width="2"/>
            <rect x="60" y="20" width="80" height="8" rx="4" class="text-line-dark"/>
            <rect x="60" y="36" width="110" height="6" rx="3" class="text-line"/>
        </g>

        <!-- Marker 3: Verification -->
        <g transform="translate(1300, 512)">
            <rect x="0" y="0" width="200" height="60" rx="8" class="bg"/>
            <circle cx="30" cy="30" r="16" class="muted-fill"/>
            <path d="M 24 26 L 30 22 L 36 26 V 30 C 36 34 30 38 30 38 C 30 38 24 34 24 30 Z" class="icon-muted" stroke-width="2"/>
            <rect x="60" y="20" width="120" height="8" rx="4" class="text-line-dark"/>
            <rect x="60" y="36" width="90" height="6" rx="3" class="text-line"/>
        </g>
    </g>
</svg>
