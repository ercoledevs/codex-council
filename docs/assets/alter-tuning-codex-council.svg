<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            :root {
                --bg: #F8FAF7;
                --surface: #FFFFFF;
                --text-main: #111512;
                --text-muted: #9AA6A0;
                --primary: #0F6B57;
                --accent: #C58A1E;
                --danger: #B84A35;
                --bg-alt: #EEF1ED;
            }
            .bg { fill: var(--bg); }
            .bg-alt { fill: var(--bg-alt); }
            .surface { fill: var(--surface); filter: drop-shadow(0 12px 24px rgba(17, 21, 18, 0.06)); }
            .surface-flat { fill: var(--surface); }
            
            .border { stroke: var(--text-muted); stroke-width: 1.5; opacity: 0.2; }
            .border-dash { stroke: var(--text-muted); stroke-width: 1.5; opacity: 0.3; stroke-dasharray: 4 6; fill: none; }
            
            .text-line-dark { fill: var(--text-main); }
            .text-line { fill: var(--text-muted); opacity: 0.4; }
            
            .connector { stroke: var(--text-muted); stroke-width: 2; fill: none; opacity: 0.5; stroke-linejoin: round; }
            
            .icon { fill: none; stroke: var(--text-main); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
            .icon-primary { fill: none; stroke: var(--primary); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
            
            .primary-fill { fill: var(--primary); opacity: 0.12; }
            .muted-fill { fill: var(--text-muted); opacity: 0.12; }

            .mat-p { fill: var(--primary); opacity: 0.9; }
            .mat-m { fill: var(--text-muted); opacity: 0.2; }
            .mat-a { fill: var(--accent); opacity: 0.9; }
            .mat-d { fill: var(--danger); opacity: 0.9; }

            .label-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; fill: var(--text-muted); opacity: 0.8; }
            .label-pill { font-family: monospace, system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: var(--text-main); }
        </style>

        <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#9AA6A0" opacity="0.5"/>
        </marker>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#111512" flood-opacity="0.1"/>
        </filter>
        <filter id="shadow-light" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#111512" flood-opacity="0.05"/>
        </filter>
    </defs>

    <!-- Base Background -->
    <rect width="1600" height="900" class="bg"/>

    <!-- CENTER CORE: GUARDRAILS -->
    <g id="guardrail-core">
        <!-- Protective Boundary Ring -->
        <circle cx="800" cy="450" r="230" fill="var(--primary)" opacity="0.02"/>
        <circle cx="800" cy="450" r="230" stroke="var(--primary)" stroke-width="2" opacity="0.2" fill="none" stroke-dasharray="4 8"/>
        
        <!-- Guardrails Label Pill -->
        <rect x="736" y="206" width="128" height="28" rx="14" class="surface" filter="url(#shadow-light)"/>
        <text x="800" y="225" text-anchor="middle" class="label-sub">GUARDRAILS</text>

        <!-- Inner Core Box -->
        <rect x="720" y="370" width="160" height="160" rx="16" class="surface"/>
        
        <!-- Compact Decision Matrix -->
        <g id="decision-matrix">
            <!-- Row 1 -->
            <rect x="740" y="390" width="24" height="24" rx="4" class="mat-p"/>
            <rect x="772" y="390" width="24" height="24" rx="4" class="mat-m"/>
            <rect x="804" y="390" width="24" height="24" rx="4" class="mat-m"/>
            <rect x="836" y="390" width="24" height="24" rx="4" class="mat-p"/>
            <!-- Row 2 -->
            <rect x="740" y="422" width="24" height="24" rx="4" class="mat-m"/>
            <rect x="772" y="422" width="24" height="24" rx="4" class="mat-a"/>
            <rect x="804" y="422" width="24" height="24" rx="4" class="mat-p"/>
            <rect x="836" y="422" width="24" height="24" rx="4" class="mat-m"/>
            <!-- Row 3 -->
            <rect x="740" y="454" width="24" height="24" rx="4" class="mat-p"/>
            <rect x="772" y="454" width="24" height="24" rx="4" class="mat-m"/>
            <rect x="804" y="454" width="24" height="24" rx="4" class="mat-d"/>
            <rect x="836" y="454" width="24" height="24" rx="4" class="mat-m"/>
            <!-- Row 4 -->
            <rect x="740" y="486" width="24" height="24" rx="4" class="mat-m"/>
            <rect x="772" y="486" width="24" height="24" rx="4" class="mat-p"/>
            <rect x="804" y="486" width="24" height="24" rx="4" class="mat-m"/>
            <rect x="836" y="486" width="24" height="24" rx="4" class="mat-p"/>
        </g>
    </g>

    <!-- CONNECTORS FROM CARDS TO GUARDRAIL RING -->
    <g id="connectors">
        <line x1="800" y1="150" x2="800" y2="216" class="connector" marker-end="url(#arrow-muted)"/>
        <line x1="1020" y1="230" x2="964" y2="286" class="connector" marker-end="url(#arrow-muted)"/>
        <line x1="1120" y1="395" x2="1034" y2="395" class="connector" marker-end="url(#arrow-muted)"/>
        <line x1="1020" y1="580" x2="964" y2="524" class="connector" marker-end="url(#arrow-muted)"/>
        <line x1="800" y1="710" x2="800" y2="684" class="connector" marker-end="url(#arrow-muted)"/>
        <line x1="580" y1="580" x2="636" y2="524" class="connector" marker-end="url(#arrow-muted)"/>
        <line x1="480" y1="395" x2="566" y2="395" class="connector" marker-end="url(#arrow-muted)"/>
        
        <!-- Dashed routing to Evidence Runner -->
        <path d="M 1030 450 H 1420 V 690" class="connector" stroke-dasharray="4 6" marker-end="url(#arrow-muted)"/>
    </g>

    <!-- ORBITING CONFIGURATION CARDS (7 ALTERS) -->
    <g id="alters-orbit">
        <!-- Alter 1 (Top) -->
        <g transform="translate(730, 40)">
            <rect x="0" y="0" width="140" height="110" rx="8" class="surface" filter="url(#shadow-light)"/>
            <text x="16" y="26" class="label-pill">Alter</text>
            <circle cx="120" cy="22" r="4" fill="var(--primary)"/>
            <rect x="16" y="44" width="108" height="4" rx="2" class="bg-alt"/>
            <rect x="16" y="44" width="80" height="4" rx="2" fill="var(--primary)"/>
            <circle cx="96" cy="46" r="6" class="surface" filter="url(#shadow-light)"/>
            <rect x="16" y="64" width="108" height="4" rx="2" class="bg-alt"/>
            <rect x="16" y="64" width="40" height="4" rx="2" fill="var(--text-muted)"/>
            <circle cx="56" cy="66" r="6" class="surface" filter="url(#shadow-light)"/>
            <rect x="16" y="86" width="28" height="14" rx="7" fill="var(--primary)"/>
            <circle cx="37" cy="93" r="5" fill="var(--surface)"/>
            <polyline points="108,90 112,94 120,86" class="icon-primary"/>
        </g>

        <!-- Alter 2 (Top Right) -->
        <g transform="translate(1000, 130)">
            <rect x="0" y="0" width="140" height="110" rx="8" class="surface" filter="url(#shadow-light)"/>
            <text x="16" y="26" class="label-pill">Alter</text>
            <circle cx="120" cy="22" r="4" fill="var(--primary)"/>
            <rect x="16" y="44" width="108" height="4" rx="2" class="bg-alt"/>
            <rect x="16" y="44" width="60" height="4" rx="2" fill="var(--primary)"/>
            <circle cx="76" cy="46" r="6" class="surface" filter="url(#shadow-light)"/>
            <rect x="16" y="64" width="108" height="4" rx="2" class="bg-alt"/>
            <rect x="16" y="64" width="70" height="4" rx="2" fill="var(--text-muted)"/>
            <circle cx="86" cy="66" r="6" class="surface" filter="url(#shadow-light)"/>
            <rect x="16" y="86" width="28" height="14" rx="7" fill="var(--primary)"/>
            <circle cx="37" cy="93" r="5" fill="var(--surface)"/>
            <polyline points="108,90 112,94 120,86" class="icon-primary"/>
        </g>

        <!-- Alter 3 (Right) -->
        <g transform="translate(1120, 340)">
            <rect x="0" y="0" width="140" height="110" rx="8" class="surface" filter="url(#shadow-light)"/>
            <text x="16" y="26" class="label-pill">Alter</text>
            <circle cx="120" cy="22" r="4" fill="var(--primary)"/>
            <rect x="16" y="44" width="108" height="4" rx="2" class="bg-alt"/>
            <rect x="16" y="44" width="30" height="4" rx="2" fill="var(--primary)"/>
            <circle cx="46" cy="46" r="6" class="surface" filter="url(#shadow-light)"/>
            <rect x="16" y="64" width="108" height="4" rx="2" class="bg-alt"/>
            <rect x="16" y="64" width="50" height="4" rx="2" fill="var(--text-muted)"/>
            <circle cx="66" cy="66" r="6" class="surface" filter="url(#shadow-light)"/>
            <rect x="16" y="86" width="28" height="14" rx="7" class="bg-alt"/>
            <circle cx="23" cy="93" r="5" fill="var(--text-muted)"/>
            <polyline points="108,90 112,94 120,86" class="icon-primary"/>
        </g>

        <!-- Alter 4 (Bottom Right) -->
        <g transform="translate(1000, 580)">
            <rect x="0" y="0" width="140" height="110" rx="8" class="surface" filter="url(#shadow-light)"/>
            <text x="16" y="26" class="label-pill">Alter</text>
            <circle cx="120" cy="22" r="4" fill="var(--primary)"/>
            <rect x="16" y="44" width="108" height="4" rx="2" class="bg-alt"/>
            <rect x="16" y="44" width="90" height="4" rx="2" fill="var(--primary)"/>
            <circle cx="106" cy="46" r="6" class="surface" filter="url(#shadow-light)"/>
            <rect x="16" y="64" width="108" height="4" rx="2" class="bg-alt"/>
            <rect x="16" y="64" width="30" height="4" rx="2" fill="var(--text-muted)"/>
            <circle cx="46" cy="66" r="6" class="surface" filter="url(#shadow-light)"/>
            <rect x="16" y="86" width="28" height="14" rx="7" fill="var(--primary)"/>
            <circle cx="37" cy="93" r="5" fill="var(--surface)"/>
            <polyline points="108,90 112,94 120,86" class="icon-primary"/>
        </g>

        <!-- Alter 5 (Bottom) -->
        <g transform="translate(730, 710)">
            <rect x="0" y="0" width="140" height="110" rx="8" class="surface" filter="url(#shadow-light)"/>
            <text x="16" y="26" class="label-pill">Alter</text>
            <circle cx="120" cy="22" r="4" fill="var(--primary)"/>
            <rect x="16" y="44" width="108" height="4" rx="2" class="bg-alt"/>
            <rect x="16" y="44" width="50" height="4" rx="2" fill="var(--primary)"/>
            <circle cx="66" cy="46" r="6" class="surface" filter="url(#shadow-light)"/>
            <rect x="16" y="64" width="108" height="4" rx="2" class="bg-alt"/>
            <rect x="16" y="64" width="80" height="4" rx="2" fill="var(--text-muted)"/>
            <circle cx="96" cy="66" r="6" class="surface" filter="url(#shadow-light)"/>
            <rect x="16" y="86" width="28" height="14" rx="7" class="bg-alt"/>
            <circle cx="23" cy="93" r="5" fill="var(--text-muted)"/>
            <polyline points="108,90 112,94 120,86" class="icon-primary"/>
        </g>

        <!-- Alter 6 (Bottom Left) -->
        <g transform="translate(460, 580)">
            <rect x="0" y="0" width="140" height="110" rx="8" class="surface" filter="url(#shadow-light)"/>
            <text x="16" y="26" class="label-pill">Alter</text>
            <circle cx="120" cy="22" r="4" fill="var(--primary)"/>
            <rect x="16" y="44" width="108" height="4" rx="2" class="bg-alt"/>
            <rect x="16" y="44" width="70" height="4" rx="2" fill="var(--primary)"/>
            <circle cx="86" cy="46" r="6" class="surface" filter="url(#shadow-light)"/>
            <rect x="16" y="64" width="108" height="4" rx="2" class="bg-alt"/>
            <rect x="16" y="64" width="20" height="4" rx="2" fill="var(--text-muted)"/>
            <circle cx="36" cy="66" r="6" class="surface" filter="url(#shadow-light)"/>
            <rect x="16" y="86" width="28" height="14" rx="7" fill="var(--primary)"/>
            <circle cx="37" cy="93" r="5" fill="var(--surface)"/>
            <polyline points="108,90 112,94 120,86" class="icon-primary"/>
        </g>

        <!-- Alter 7 (Left) -->
        <g transform="translate(340, 340)">
            <rect x="0" y="0" width="140" height="110" rx="8" class="surface" filter="url(#shadow-light)"/>
            <text x="16" y="26" class="label-pill">Alter</text>
            <circle cx="120" cy="22" r="4" fill="var(--primary)"/>
            <rect x="16" y="44" width="108" height="4" rx="2" class="bg-alt"/>
            <rect x="16" y="44" width="40" height="4" rx="2" fill="var(--primary)"/>
            <circle cx="56" cy="46" r="6" class="surface" filter="url(#shadow-light)"/>
            <rect x="16" y="64" width="108" height="4" rx="2" class="bg-alt"/>
            <rect x="16" y="64" width="60" height="4" rx="2" fill="var(--text-muted)"/>
            <circle cx="76" cy="66" r="6" class="surface" filter="url(#shadow-light)"/>
            <rect x="16" y="86" width="28" height="14" rx="7" fill="var(--primary)"/>
            <circle cx="37" cy="93" r="5" fill="var(--surface)"/>
            <polyline points="108,90 112,94 120,86" class="icon-primary"/>
        </g>
    </g>

    <!-- RIGHT: PREVIEW DIFF CARD -->
    <g id="preview-visual" transform="translate(1300, 80)">
        <rect x="0" y="0" width="240" height="160" rx="12" class="surface" filter="url(#shadow)"/>
        
        <!-- Headers -->
        <text x="20" y="30" class="label-pill">Preview</text>
        
        <!-- Reset Action -->
        <rect x="164" y="14" width="60" height="24" rx="12" class="bg-alt"/>
        <text x="194" y="30" text-anchor="middle" class="label-pill" font-size="12" opacity="0.6">Reset</text>
        
        <line x1="0" y1="46" x2="240" y2="46" class="border"/>

        <!-- Diff Graphics -->
        <!-- Old Tuning -->
        <rect x="16" y="60" width="208" height="36" rx="6" class="muted-fill"/>
        <line x1="32" y1="78" x2="190" y2="78" stroke="var(--text-muted)" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
        
        <!-- New Tuning -->
        <rect x="16" y="106" width="208" height="36" rx="6" class="primary-fill"/>
        <line x1="32" y1="124" x2="160" y2="124" stroke="var(--primary)" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- BOTTOM RIGHT: EVIDENCE RUNNER CARD -->
    <g id="evidence-card" transform="translate(1300, 700)">
        <rect x="0" y="0" width="240" height="140" rx="12" class="surface" filter="url(#shadow)"/>
        <text x="24" y="32" class="label-pill">Evidence</text>
        
        <!-- Mini Browser Frame Inside -->
        <rect x="24" y="50" width="192" height="70" rx="6" class="bg-alt"/>
        <line x1="24" y1="64" x2="216" y2="64" class="border"/>
        <circle cx="34" cy="57" r="2.5" fill="var(--text-muted)"/>
        <circle cx="44" cy="57" r="2.5" fill="var(--text-muted)"/>
        
        <!-- Evidence details -->
        <rect x="34" y="76" width="120" height="6" rx="3" class="text-line-dark"/>
        <rect x="34" y="90" width="80" height="6" rx="3" class="text-line"/>
        
        <!-- Verified check -->
        <polyline points="186,80 192,86 202,76" class="icon-primary" stroke-width="2"/>
    </g>
</svg>
