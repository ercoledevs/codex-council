<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            :root {
                --bg: #F8FAF7;
                --surface: #FFFFFF;
                --text-main: #111512;
                --text-muted: #9AA6A0;
                --primary: #0F6B57;
                --accent: #C58A1E;
                --danger: #B84A35;
            }
            .bg { fill: var(--bg); }
            .surface { fill: var(--surface); filter: drop-shadow(0 12px 24px rgba(17, 21, 18, 0.06)); }
            .surface-flat { fill: var(--surface); }
            .border { stroke: var(--text-muted); stroke-width: 1.5; opacity: 0.2; }
            .grid-line { stroke: var(--text-muted); stroke-width: 1; opacity: 0.15; }
            
            .text-line-dark { fill: var(--text-main); }
            .text-line { fill: var(--text-muted); opacity: 0.4; }
            
            .connector { stroke: var(--text-muted); stroke-width: 2; fill: none; opacity: 0.5; stroke-linejoin: round; }
            .connector-active { stroke: var(--primary); stroke-width: 2.5; fill: none; stroke-linejoin: round; }
            
            .icon { fill: none; stroke: var(--text-main); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
            .icon-primary { fill: none; stroke: var(--primary); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
            .icon-muted { fill: none; stroke: var(--text-muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
            .icon-warn { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
            .icon-danger { fill: none; stroke: var(--danger); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
            
            .accent-fill { fill: var(--accent); opacity: 0.15; }
            .danger-fill { fill: var(--danger); opacity: 0.12; }
            .warn-fill { fill: var(--accent); opacity: 0.12; }
            .muted-fill { fill: var(--text-muted); opacity: 0.12; }
        </style>

        <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#9AA6A0" opacity="0.5"/>
        </marker>
        <marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F6B57"/>
        </marker>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#111512" flood-opacity="0.08"/>
        </filter>
    </defs>

    <!-- Base Background -->
    <rect width="1920" height="1080" class="bg"/>

    <!-- Technical Grid (Right side only) -->
    <g id="technical-grid">
        <line x1="960" y1="0" x2="960" y2="1080" class="grid-line" stroke-dasharray="4 8"/>
        <line x1="1280" y1="0" x2="1280" y2="1080" class="grid-line"/>
        <line x1="1600" y1="0" x2="1600" y2="1080" class="grid-line"/>
        <line x1="960" y1="270" x2="1920" y2="270" class="grid-line"/>
        <line x1="960" y1="540" x2="1920" y2="540" class="grid-line"/>
        <line x1="960" y1="810" x2="1920" y2="810" class="grid-line"/>
        
        <!-- Subtle crosshairs for tooling feel -->
        <path d="M 1275 270 H 1285 M 1280 265 V 275" class="icon-muted" stroke-width="1"/>
        <path d="M 1595 270 H 1605 M 1600 265 V 275" class="icon-muted" stroke-width="1"/>
        <path d="M 1275 810 H 1285 M 1280 805 V 815" class="icon-muted" stroke-width="1"/>
        <path d="M 1595 810 H 1605 M 1600 805 V 815" class="icon-muted" stroke-width="1"/>
    </g>

    <!-- Connector Lines -->
    <g id="connectors">
        <!-- Nodes to Decision Table -->
        <path d="M 1000 296 V 430 H 1076" class="connector" marker-end="url(#arrow-muted)"/>
        <path d="M 1260 256 V 386" class="connector-active" marker-end="url(#arrow-active)"/>
        <path d="M 1520 316 V 450 H 1444" class="connector" marker-end="url(#arrow-muted)"/>
        <path d="M 1000 724 V 620 H 1076" class="connector" marker-end="url(#arrow-muted)"/>
        <path d="M 1260 804 V 674" class="connector" marker-end="url(#arrow-muted)"/>
        <path d="M 956 530 H 1076" class="connector-active" marker-end="url(#arrow-active)"/>

        <!-- Decision Table to Synthesis -->
        <path d="M 1440 550 H 1556" class="connector-active" marker-end="url(#arrow-active)"/>

        <!-- Top Connectors -->
        <path d="M 1520 244 V 194" class="connector" marker-end="url(#arrow-muted)"/>
        <path d="M 1620 135 H 1696" class="connector" marker-end="url(#arrow-muted)"/>

        <!-- Lower Connectors -->
        <path d="M 1690 660 V 736" class="connector" marker-end="url(#arrow-muted)"/>
        <path d="M 1296 830 H 1496" class="connector" marker-end="url(#arrow-muted)"/>
    </g>

    <!-- Central Decision Table Matrix -->
    <g id="decision-table">
        <rect x="1080" y="390" width="360" height="280" rx="8" class="surface"/>
        
        <!-- Top Accent -->
        <path d="M 1080 398 A 8 8 0 0 1 1088 390 H 1432 A 8 8 0 0 1 1440 398 V 394 H 1080 Z" fill="var(--primary)"/>

        <!-- Header -->
        <rect x="1100" y="410" width="320" height="36" rx="4" class="bg"/>
        <rect x="1116" y="423" width="90" height="10" rx="2" class="text-line-dark"/>
        <rect x="1350" y="425" width="54" height="6" rx="2" class="text-line"/>

        <!-- Row 1 -->
        <rect x="1100" y="466" width="100" height="26" rx="4" class="bg"/>
        <rect x="1112" y="475" width="60" height="8" rx="2" class="text-line-dark"/>
        <rect x="1210" y="466" width="40" height="26" rx="4" class="muted-fill"/>
        <rect x="1260" y="466" width="40" height="26" rx="4" class="accent-fill"/>
        <rect x="1310" y="466" width="110" height="26" rx="4" class="bg"/>
        <polyline points="1320,484 1340,474 1360,476 1380,466" class="icon-primary" stroke-width="1.5"/>

        <!-- Row 2 -->
        <rect x="1100" y="502" width="100" height="26" rx="4" class="bg"/>
        <rect x="1112" y="511" width="75" height="8" rx="2" class="text-line-dark"/>
        <rect x="1210" y="502" width="40" height="26" rx="4" class="accent-fill"/>
        <rect x="1260" y="502" width="40" height="26" rx="4" class="warn-fill"/>
        <rect x="1310" y="502" width="110" height="26" rx="4" class="bg"/>
        <polyline points="1320,520 1340,514 1360,514 1380,504" class="icon-primary" stroke-width="1.5"/>

        <!-- Row 3 -->
        <rect x="1100" y="538" width="100" height="26" rx="4" class="bg"/>
        <rect x="1112" y="547" width="50" height="8" rx="2" class="text-line-dark"/>
        <rect x="1210" y="538" width="40" height="26" rx="4" class="muted-fill"/>
        <rect x="1260" y="538" width="40" height="26" rx="4" class="accent-fill"/>
        <rect x="1310" y="538" width="110" height="26" rx="4" class="bg"/>
        <polyline points="1320,544 1340,554 1360,548 1380,558" class="icon-muted" stroke-width="1.5"/>

        <!-- Row 4 -->
        <rect x="1100" y="574" width="100" height="26" rx="4" class="bg"/>
        <rect x="1112" y="583" width="85" height="8" rx="2" class="text-line-dark"/>
        <rect x="1210" y="574" width="40" height="26" rx="4" class="danger-fill"/>
        <rect x="1260" y="574" width="40" height="26" rx="4" class="muted-fill"/>
        <rect x="1310" y="574" width="110" height="26" rx="4" class="bg"/>
        <polyline points="1320,594 1340,580 1360,584 1380,576" class="icon-danger" stroke-width="1.5"/>

        <!-- Footer / Action -->
        <line x1="1100" y1="620" x2="1420" y2="620" class="border"/>
        <rect x="1300" y="634" width="120" height="22" rx="4" class="accent-fill"/>
        <rect x="1330" y="641" width="60" height="8" rx="2" fill="var(--accent)"/>
        
        <circle cx="1106" cy="645" r="4" fill="var(--muted)" opacity="0.4"/>
        <rect x="1116" y="642" width="40" height="6" rx="2" class="text-line"/>
    </g>

    <!-- Council Nodes -->
    <g id="council-nodes">
        <!-- Node 1: Architecture -->
        <g transform="translate(1000, 260)">
            <circle cx="0" cy="0" r="36" class="surface"/>
            <circle cx="0" cy="0" r="30" class="border"/>
            <rect x="-14" y="-14" width="12" height="12" class="icon" rx="2"/>
            <rect x="2" y="-14" width="12" height="12" class="icon" rx="2"/>
            <rect x="-14" y="2" width="12" height="12" class="icon" rx="2"/>
            <rect x="2" y="2" width="12" height="12" class="icon" rx="2"/>
            <circle cx="26" cy="-26" r="10" class="surface-flat" filter="url(#shadow)"/>
            <circle cx="26" cy="-26" r="4" fill="var(--muted)"/>
        </g>

        <!-- Node 2: Reliability -->
        <g transform="translate(1260, 220)">
            <circle cx="0" cy="0" r="36" class="surface"/>
            <circle cx="0" cy="0" r="30" class="border"/>
            <polyline points="-16,0 -8,0 -4,-10 4,10 8,0 16,0" class="icon-primary"/>
            <circle cx="26" cy="-26" r="10" class="surface-flat" filter="url(#shadow)"/>
            <circle cx="26" cy="-26" r="4" fill="var(--primary)"/>
        </g>

        <!-- Node 3: Security -->
        <g transform="translate(1520, 280)">
            <circle cx="0" cy="0" r="36" class="surface"/>
            <circle cx="0" cy="0" r="30" class="border"/>
            <path d="M 0,-16 L 14,-10 V 2 C 14,12 0,18 0,18 C 0,18 -14,12 -14,2 V -10 Z" class="icon"/>
        </g>

        <!-- Node 4: Product Signals -->
        <g transform="translate(1000, 760)">
            <circle cx="0" cy="0" r="36" class="surface"/>
            <circle cx="0" cy="0" r="30" class="border"/>
            <rect x="-12" y="-2" width="6" height="14" class="icon" rx="1"/>
            <rect x="-3" y="-8" width="6" height="20" class="icon" rx="1"/>
            <rect x="6" y="-16" width="6" height="28" class="icon" rx="1"/>
        </g>

        <!-- Node 5: Red-team Warning -->
        <g transform="translate(1260, 840)">
            <circle cx="0" cy="0" r="36" class="surface"/>
            <circle cx="0" cy="0" r="30" class="border"/>
            <polygon points="0,-16 -14,12 14,12" class="icon-warn"/>
            <line x1="0" y1="-6" x2="0" y2="2" class="icon-warn"/>
            <circle cx="0" cy="8" r="1.5" fill="var(--accent)"/>
        </g>

        <!-- Node 6: Performance -->
        <g transform="translate(920, 530)">
            <circle cx="0" cy="0" r="36" class="surface"/>
            <circle cx="0" cy="0" r="30" class="border"/>
            <path d="M -14,-6 H 6 L -2,6 H 14" class="icon-primary"/>
            <line x1="-16" y1="0" x2="-10" y2="0" class="icon-primary"/>
            <line x1="-10" y1="6" x2="-6" y2="6" class="icon-primary"/>
            <circle cx="26" cy="-26" r="10" class="surface-flat" filter="url(#shadow)"/>
            <circle cx="26" cy="-26" r="4" fill="var(--primary)"/>
        </g>
    </g>

    <!-- Top Review Cards -->
    <g id="cards-top">
        <!-- Review Card 1 -->
        <rect x="1460" y="80" width="160" height="110" rx="6" class="surface"/>
        <circle cx="1480" cy="100" r="5" fill="var(--primary)"/>
        <rect x="1496" y="96" width="60" height="8" rx="2" class="text-line-dark"/>
        
        <rect x="1480" y="116" width="120" height="6" rx="2" class="text-line"/>
        <rect x="1480" y="128" width="90" height="6" rx="2" class="text-line"/>
        <rect x="1480" y="140" width="100" height="6" rx="2" class="text-line"/>
        <rect x="1480" y="152" width="50" height="6" rx="2" class="text-line"/>
        
        <line x1="1460" y1="168" x2="1620" y2="168" class="border"/>
        <rect x="1480" y="174" width="30" height="6" rx="2" fill="var(--primary)"/>

        <!-- Review Card 2 (Diff) -->
        <rect x="1700" y="140" width="140" height="130" rx="6" class="surface"/>
        <rect x="1712" y="156" width="116" height="22" rx="4" class="danger-fill"/>
        <rect x="1720" y="163" width="80" height="8" rx="2" fill="var(--danger)"/>
        
        <rect x="1712" y="184" width="116" height="22" rx="4" class="accent-fill"/>
        <rect x="1720" y="191" width="90" height="8" rx="2" fill="var(--accent)"/>
        
        <rect x="1712" y="212" width="116" height="22" rx="4" class="bg"/>
        <rect x="1720" y="219" width="60" height="8" rx="2" class="text-line"/>
    </g>

    <!-- Lower Evidence Card -->
    <g id="card-evidence">
        <rect x="1500" y="740" width="320" height="180" rx="8" class="surface"/>
        
        <!-- Browser Chrome -->
        <path d="M 1500 748 C 1500 743.5 1503.5 740 1508 740 H 1812 C 1816.5 740 1820 743.5 1820 748 V 766 H 1500 Z" class="bg"/>
        <circle cx="1516" cy="753" r="3.5" fill="var(--muted)" opacity="0.6"/>
        <circle cx="1528" cy="753" r="3.5" fill="var(--muted)" opacity="0.6"/>
        <circle cx="1540" cy="753" r="3.5" fill="var(--muted)" opacity="0.6"/>
        <rect x="1556" y="748" width="180" height="10" rx="3" class="surface-flat"/>
        <rect x="1564" y="751" width="80" height="4" rx="2" class="text-line"/>
        <line x1="1500" y1="766" x2="1820" y2="766" class="border"/>

        <!-- Checklist Items -->
        <g transform="translate(1520, 784)">
            <!-- Item 1 -->
            <polyline points="0,6 4,10 12,2" class="icon-primary"/>
            <rect x="26" y="2" width="140" height="8" rx="2" class="text-line-dark"/>
            <rect x="26" y="16" width="220" height="6" rx="2" class="text-line"/>
            
            <!-- Item 2 -->
            <polyline points="0,38 4,42 12,34" class="icon-primary"/>
            <rect x="26" y="34" width="120" height="8" rx="2" class="text-line-dark"/>
            <rect x="26" y="48" width="180" height="6" rx="2" class="text-line"/>
            
            <!-- Item 3 -->
            <polyline points="0,70 4,74 12,66" class="icon-muted"/>
            <rect x="26" y="66" width="160" height="8" rx="2" class="text-line-dark"/>
            <rect x="26" y="80" width="190" height="6" rx="2" class="text-line"/>
            
            <!-- Item 4 -->
            <polyline points="0,102 4,106 12,98" class="icon-primary"/>
            <rect x="26" y="98" width="110" height="8" rx="2" class="text-line-dark"/>
            <rect x="26" y="112" width="170" height="6" rx="2" class="text-line"/>
        </g>
    </g>

    <!-- Far Right Synthesis Card -->
    <g id="card-synthesis">
        <rect x="1560" y="440" width="260" height="220" rx="8" class="surface"/>
        
        <!-- Header -->
        <rect x="1580" y="460" width="40" height="40" rx="8" class="accent-fill"/>
        <path d="M 1592 480 L 1596 484 L 1608 472" stroke="var(--accent)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        
        <rect x="1636" y="466" width="120" height="12" rx="3" class="text-line-dark"/>
        <rect x="1636" y="484" width="80" height="8" rx="2" class="text-line"/>
        
        <line x1="1560" y1="520" x2="1820" y2="520" class="border"/>
        
        <!-- Metric 1 -->
        <circle cx="1600" cy="560" r="18" class="icon-primary"/>
        <path d="M 1600 542 A 18 18 0 0 1 1616 568" stroke="var(--primary)" stroke-width="5" fill="none" stroke-linecap="round"/>
        <rect x="1636" y="550" width="70" height="8" rx="2" class="text-line-dark"/>
        <rect x="1636" y="564" width="50" height="6" rx="2" class="text-line"/>

        <!-- Metric 2 -->
        <circle cx="1600" cy="610" r="18" class="icon-muted"/>
        <path d="M 1600 592 A 18 18 0 0 1 1618 610" stroke="var(--danger)" stroke-width="5" fill="none" stroke-linecap="round"/>
        <rect x="1636" y="600" width="80" height="8" rx="2" class="text-line-dark"/>
        <rect x="1636" y="614" width="60" height="6" rx="2" class="text-line"/>
    </g>
</svg>
