<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            :root {
                --bg: #F8FAF7;
                --surface: #FFFFFF;
                --text-main: #111512;
                --text-muted: #9AA6A0;
                --primary: #0F6B57;
                --accent: #C58A1E;
                --danger: #B84A35;
            }
            .bg { fill: var(--bg); }
            .surface { fill: var(--surface); filter: drop-shadow(0 12px 24px rgba(17, 21, 18, 0.08)); }
            .surface-flat { fill: var(--surface); }
            
            .grid-line { stroke: var(--text-muted); stroke-width: 1.5; opacity: 0.15; }
            .grid-dash { stroke: var(--text-muted); stroke-width: 1.5; opacity: 0.2; stroke-dasharray: 4 8; }
            
            .connector { stroke: var(--text-muted); stroke-width: 2.5; fill: none; opacity: 0.4; stroke-linejoin: round; }
            .connector-active { stroke: var(--primary); stroke-width: 3; fill: none; opacity: 0.8; stroke-linejoin: round; }
            
            .icon { fill: none; stroke: var(--text-main); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
            .icon-primary { fill: none; stroke: var(--primary); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
            
            .text-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 68px; font-weight: 800; letter-spacing: -2px; fill: var(--text-main); }
            .text-subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 30px; font-weight: 500; letter-spacing: -0.5px; fill: var(--text-muted); }
            
            .mat-p { fill: var(--primary); opacity: 0.9; }
            .mat-m { fill: var(--text-muted); opacity: 0.2; }
            .mat-a { fill: var(--accent); opacity: 0.9; }
            .mat-d { fill: var(--danger); opacity: 0.9; }
        </style>

        <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#9AA6A0" opacity="0.4"/>
        </marker>
        <marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F6B57" opacity="0.8"/>
        </marker>
        <filter id="shadow-lg" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#111512" flood-opacity="0.12"/>
        </filter>
        <filter id="shadow-sm" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#111512" flood-opacity="0.08"/>
        </filter>
    </defs>

    <!-- Base Background -->
    <rect width="1200" height="630" class="bg"/>

    <!-- Subtle Technical Grid -->
    <g id="technical-grid">
        <line x1="80" y1="0" x2="80" y2="630" class="grid-line"/>
        <line x1="520" y1="0" x2="520" y2="630" class="grid-dash"/>
        <line x1="680" y1="0" x2="680" y2="630" class="grid-dash"/>
        <line x1="1120" y1="0" x2="1120" y2="630" class="grid-line"/>
        
        <line x1="0" y1="100" x2="1200" y2="100" class="grid-line"/>
        <line x1="0" y1="530" x2="1200" y2="530" class="grid-line"/>
        
        <!-- Crosshairs -->
        <path d="M 75 100 H 85 M 80 95 V 105" stroke="var(--text-main)" stroke-width="2" opacity="0.2"/>
        <path d="M 1115 100 H 1125 M 1120 95 V 105" stroke="var(--text-main)" stroke-width="2" opacity="0.2"/>
        <path d="M 75 530 H 85 M 80 525 V 535" stroke="var(--text-main)" stroke-width="2" opacity="0.2"/>
        <path d="M 1115 530 H 1125 M 1120 525 V 535" stroke="var(--text-main)" stroke-width="2" opacity="0.2"/>
    </g>

    <!-- LEFT SIDE: Mark & Text -->
    <g id="brand-group">
        <!-- Abstract Mark -->
        <g transform="translate(80, 160)">
            <rect x="0" y="0" width="56" height="56" rx="16" fill="var(--primary)"/>
            <rect x="72" y="0" width="56" height="56" rx="16" fill="none" stroke="var(--text-main)" stroke-width="6"/>
            <rect x="0" y="72" width="56" height="56" rx="16" fill="none" stroke="var(--primary)" stroke-width="6"/>
            <rect x="72" y="72" width="56" height="56" rx="16" fill="var(--text-main)"/>
            
            <!-- Connection points inside mark -->
            <circle cx="64" cy="64" r="8" fill="var(--bg)"/>
            <circle cx="64" cy="64" r="4" fill="var(--accent)"/>
        </g>

        <!-- Titles -->
        <text x="80" y="400" class="text-title">Codex Council</text>
        <text x="80" y="450" class="text-subtitle">Structured review for Codex</text>
    </g>

    <!-- CENTER: Scoring Matrix -->
    <g id="center-matrix" transform="translate(560, 245)">
        <rect x="0" y="0" width="140" height="140" rx="16" class="surface" filter="url(#shadow-lg)"/>
        
        <!-- 4x4 Grid -->
        <g transform="translate(18, 18)">
            <!-- Row 1 -->
            <rect x="0" y="0" width="20" height="20" rx="4" class="mat-p"/>
            <rect x="28" y="0" width="20" height="20" rx="4" class="mat-m"/>
            <rect x="56" y="0" width="20" height="20" rx="4" class="mat-m"/>
            <rect x="84" y="0" width="20" height="20" rx="4" class="mat-p"/>
            <!-- Row 2 -->
            <rect x="0" y="28" width="20" height="20" rx="4" class="mat-m"/>
            <rect x="28" y="28" width="20" height="20" rx="4" class="mat-a"/>
            <rect x="56" y="28" width="20" height="20" rx="4" class="mat-p"/>
            <rect x="84" y="28" width="20" height="20" rx="4" class="mat-m"/>
            <!-- Row 3 -->
            <rect x="0" y="56" width="20" height="20" rx="4" class="mat-p"/>
            <rect x="28" y="56" width="20" height="20" rx="4" class="mat-m"/>
            <rect x="56" y="56" width="20" height="20" rx="4" class="mat-d"/>
            <rect x="84" y="56" width="20" height="20" rx="4" class="mat-m"/>
            <!-- Row 4 -->
            <rect x="0" y="84" width="20" height="20" rx="4" class="mat-m"/>
            <rect x="28" y="84" width="20" height="20" rx="4" class="mat-p"/>
            <rect x="56" y="84" width="20" height="20" rx="4" class="mat-m"/>
            <rect x="84" y="84" width="20" height="20" rx="4" class="mat-p"/>
        </g>
    </g>

    <!-- DATA FLOW CONNECTORS (Matrix to Nodes to Synthesis) -->
    <g id="flow-connectors">
        <!-- From Matrix to Nodes -->
        <path d="M 700 280 C 740 280, 740 180, 780 180" class="connector"/>
        <path d="M 700 315 H 750" class="connector-active" marker-end="url(#arrow-active)"/>
        <path d="M 700 350 C 740 350, 740 450, 780 450" class="connector"/>

        <!-- From Nodes to Synthesis -->
        <path d="M 836 180 C 920 180, 940 280, 1010 280" class="connector" marker-end="url(#arrow-muted)"/>
        <path d="M 806 315 H 1010" class="connector-active" marker-end="url(#arrow-active)"/>
        <path d="M 836 450 C 920 450, 940 350, 1010 350" class="connector" marker-end="url(#arrow-muted)"/>
        
        <path d="M 896 120 C 960 120, 960 250, 1010 250" class="connector"/>
        <path d="M 896 510 C 960 510, 960 380, 1010 380" class="connector"/>
    </g>

    <!-- RIGHT SIDE: 6 Review Nodes -->
    <g id="review-nodes">
        <!-- Node 1 (Top Inner) -->
        <g transform="translate(808, 180)">
            <circle cx="0" cy="0" r="28" class="surface"/>
            <circle cx="0" cy="0" r="22" stroke="var(--text-muted)" stroke-width="1.5" fill="none" opacity="0.3"/>
            <rect x="-10" y="-10" width="8" height="8" class="icon" rx="2"/>
            <rect x="2" y="-10" width="8" height="8" class="icon" rx="2"/>
            <rect x="-10" y="2" width="8" height="8" class="icon" rx="2"/>
            <rect x="2" y="2" width="8" height="8" class="icon" rx="2"/>
        </g>

        <!-- Node 2 (Top Outer) -->
        <g transform="translate(868, 120)">
            <circle cx="0" cy="0" r="28" class="surface"/>
            <circle cx="0" cy="0" r="22" stroke="var(--text-muted)" stroke-width="1.5" fill="none" opacity="0.3"/>
            <path d="M 0,-12 L 10,-6 V 2 C 10,10 0,14 0,14 C 0,14 -10,10 -10,2 V -6 Z" class="icon-primary"/>
        </g>

        <!-- Node 3 (Center Inner) - Active -->
        <g transform="translate(778, 315)">
            <circle cx="0" cy="0" r="28" class="surface"/>
            <circle cx="0" cy="0" r="22" stroke="var(--primary)" stroke-width="2" fill="none" opacity="0.8"/>
            <polyline points="-12,0 -4,0 0,-8 6,8 10,0 16,0" class="icon-primary"/>
        </g>

        <!-- Node 4 (Center Outer) -->
        <g transform="translate(888, 315)">
            <circle cx="0" cy="0" r="28" class="surface"/>
            <circle cx="0" cy="0" r="22" stroke="var(--text-muted)" stroke-width="1.5" fill="none" opacity="0.3"/>
            <circle cx="0" cy="0" r="10" class="icon"/>
            <circle cx="0" cy="0" r="3" fill="var(--text-main)"/>
        </g>

        <!-- Node 5 (Bottom Inner) -->
        <g transform="translate(808, 450)">
            <circle cx="0" cy="0" r="28" class="surface"/>
            <circle cx="0" cy="0" r="22" stroke="var(--text-muted)" stroke-width="1.5" fill="none" opacity="0.3"/>
            <rect x="-8" y="-2" width="4" height="10" class="icon" rx="1"/>
            <rect x="-1" y="-8" width="4" height="16" class="icon" rx="1"/>
            <rect x="6" y="-12" width="4" height="20" class="icon" rx="1"/>
        </g>

        <!-- Node 6 (Bottom Outer) -->
        <g transform="translate(868, 510)">
            <circle cx="0" cy="0" r="28" class="surface"/>
            <circle cx="0" cy="0" r="22" stroke="var(--text-muted)" stroke-width="1.5" fill="none" opacity="0.3"/>
            <path d="M -10,-4 H 2 L -2,6 H 10" class="icon"/>
            <line x1="-12" y1="2" x2="-6" y2="2" class="icon"/>
            
            <!-- AMBER RISK MARKER -->
            <g transform="translate(20, -16)" filter="url(#shadow-sm)">
                <circle cx="0" cy="0" r="12" fill="var(--accent)"/>
                <line x1="0" y1="-4" x2="0" y2="2" stroke="var(--surface)" stroke-width="3" stroke-linecap="round"/>
                <circle cx="0" cy="6" r="1.5" fill="var(--surface)"/>
            </g>
        </g>
    </g>

    <!-- RIGHT SIDE: Final Synthesis Card -->
    <g id="synthesis-card" transform="translate(1010, 195)">
        <rect x="0" y="0" width="130" height="240" rx="12" class="surface" filter="url(#shadow-lg)"/>
        
        <!-- Header Ribbon -->
        <path d="M 0 12 C 0 5.37 5.37 0 12 0 H 118 C 124.63 0 130 5.37 130 12 V 48 H 0 Z" fill="var(--bg)"/>
        <rect x="16" y="20" width="60" height="8" rx="4" fill="var(--text-main)"/>
        <line x1="0" y1="48" x2="130" y2="48" stroke="var(--text-muted)" stroke-width="1" opacity="0.2"/>

        <!-- Abstract Content Lines -->
        <rect x="16" y="68" width="98" height="6" rx="3" fill="var(--text-muted)" opacity="0.3"/>
        <rect x="16" y="84" width="70" height="6" rx="3" fill="var(--text-muted)" opacity="0.3"/>
        <rect x="16" y="100" width="85" height="6" rx="3" fill="var(--text-muted)" opacity="0.3"/>
        
        <rect x="16" y="128" width="98" height="6" rx="3" fill="var(--text-muted)" opacity="0.3"/>
        <rect x="16" y="144" width="50" height="6" rx="3" fill="var(--text-muted)" opacity="0.3"/>

        <!-- Separator -->
        <line x1="16" y1="172" x2="114" y2="172" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.3"/>

        <!-- GREEN VERIFICATION MARKER -->
        <g transform="translate(65, 204)">
            <circle cx="0" cy="0" r="18" fill="var(--primary)" opacity="0.15"/>
            <circle cx="0" cy="0" r="12" fill="var(--primary)"/>
            <polyline points="-4,0 -1,3 5,-3" stroke="var(--surface)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
    </g>

</svg>
