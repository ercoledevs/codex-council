<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            :root {
                --bg: #F8FAF7;
                --surface: #FFFFFF;
                --text-main: #111512;
                --text-muted: #9AA6A0;
                --primary: #0F6B57;
                --accent: #C58A1E;
                --danger: #B84A35;
                --bg-alt: #EEF1ED;
            }
            .bg { fill: var(--bg); }
            .bg-alt { fill: var(--bg-alt); }
            .surface { fill: var(--surface); filter: drop-shadow(0 12px 24px rgba(17, 21, 18, 0.06)); }
            .surface-flat { fill: var(--surface); }
            
            .border { stroke: var(--text-muted); stroke-width: 1.5; opacity: 0.2; }
            .border-dash { stroke: var(--text-muted); stroke-width: 1.5; opacity: 0.3; stroke-dasharray: 4 6; fill: none; }
            
            .text-line-dark { fill: var(--text-main); }
            .text-line { fill: var(--text-muted); opacity: 0.4; }
            
            .connector { stroke: var(--text-muted); stroke-width: 2; fill: none; opacity: 0.5; stroke-linejoin: round; }
            .connector-active { stroke: var(--primary); stroke-width: 2.5; fill: none; stroke-linejoin: round; }
            
            .icon { fill: none; stroke: var(--text-main); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
            .icon-primary { fill: none; stroke: var(--primary); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
            .icon-muted { fill: none; stroke: var(--text-muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
            .icon-warn { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
            .icon-danger { fill: none; stroke: var(--danger); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
            
            .accent-fill { fill: var(--accent); opacity: 0.15; }
            .danger-fill { fill: var(--danger); opacity: 0.12; }
            .primary-fill { fill: var(--primary); opacity: 0.12; }
            .muted-fill { fill: var(--text-muted); opacity: 0.12; }

            .label-title { font-family: system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: 700; fill: var(--text-main); }
            .label-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; fill: var(--text-muted); opacity: 0.8; }
            .label-pill { font-family: monospace, system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: var(--text-main); }
            .label-pill-primary { font-family: monospace, system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: var(--primary); }
        </style>

        <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#9AA6A0" opacity="0.5"/>
        </marker>
        <marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F6B57"/>
        </marker>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#111512" flood-opacity="0.1"/>
        </filter>
        <filter id="shadow-light" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#111512" flood-opacity="0.05"/>
        </filter>
    </defs>

    <!-- Base Background -->
    <rect width="1600" height="900" class="bg"/>

    <!-- DATA FLOW CONNECTORS -->
    <g id="connectors">
        <!-- Top Nodes to UX Panel -->
        <path d="M 200 190 V 230 H 290 V 280" class="connector" marker-end="url(#arrow-muted)"/>
        <path d="M 290 150 V 280" class="connector" marker-end="url(#arrow-muted)"/>
        <path d="M 380 190 V 230 H 290 V 280" class="connector" marker-end="url(#arrow-muted)"/>

        <!-- UX Panel to Browser Window -->
        <path d="M 420 450 H 500" class="connector-active" marker-end="url(#arrow-active)"/>

        <!-- Browser Window to Evidence Panel -->
        <path d="M 1100 450 H 1180" class="connector-active" marker-end="url(#arrow-active)"/>

        <!-- Bottom Runner Node to Evidence Panel -->
        <path d="M 1310 730 V 620" class="connector" marker-end="url(#arrow-muted)"/>
    </g>

    <!-- TOP COUNCIL FEEDBACK NODES -->
    <g id="top-nodes">
        <g transform="translate(200, 160)">
            <circle cx="0" cy="0" r="30" class="surface"/>
            <circle cx="0" cy="0" r="24" class="border"/>
            <!-- A11y Contrast Icon -->
            <path d="M 0 -12 A 12 12 0 0 0 0 12 Z" class="icon-muted"/>
            <path d="M 0 -12 A 12 12 0 0 1 0 12 Z" fill="var(--text-muted)" opacity="0.4"/>
        </g>
        <g transform="translate(290, 120)">
            <circle cx="0" cy="0" r="30" class="surface"/>
            <circle cx="0" cy="0" r="24" class="border"/>
            <!-- Target / Focus Icon -->
            <circle cx="0" cy="0" r="10" class="icon-primary"/>
            <circle cx="0" cy="0" r="2" fill="var(--primary)"/>
            <line x1="0" y1="-14" x2="0" y2="-6" class="icon-primary"/>
            <line x1="0" y1="6" x2="0" y2="14" class="icon-primary"/>
            <line x1="-14" y1="0" x2="-6" y2="0" class="icon-primary"/>
            <line x1="6" y1="0" x2="14" y2="0" class="icon-primary"/>
        </g>
        <g transform="translate(380, 160)">
            <circle cx="0" cy="0" r="30" class="surface"/>
            <circle cx="0" cy="0" r="24" class="border"/>
            <!-- Layout / DOM Icon -->
            <rect x="-10" y="-10" width="8" height="8" class="icon-muted" rx="1"/>
            <rect x="2" y="-10" width="8" height="8" class="icon-muted" rx="1"/>
            <rect x="-10" y="2" width="20" height="8" class="icon-muted" rx="1"/>
        </g>
    </g>

    <!-- LEFT: UX CRITIQUE PANEL -->
    <g id="ux-panel">
        <rect x="160" y="280" width="260" height="340" rx="12" class="surface"/>
        <text x="290" y="325" text-anchor="middle" class="label-title">UX</text>
        
        <!-- Risk Marker 1 -->
        <g transform="translate(180, 350)">
            <rect x="0" y="0" width="220" height="48" rx="8" class="danger-fill"/>
            <polygon points="24,14 16,32 32,32" class="icon-danger"/>
            <line x1="24" y1="20" x2="24" y2="24" class="icon-danger"/>
            <circle cx="24" cy="28" r="1.5" fill="var(--danger)"/>
            <rect x="46" y="16" width="120" height="6" rx="3" class="text-line-dark"/>
            <rect x="46" y="28" width="80" height="4" rx="2" class="text-line"/>
        </g>

        <!-- Risk Marker 2 -->
        <g transform="translate(180, 410)">
            <rect x="0" y="0" width="220" height="48" rx="8" class="primary-fill"/>
            <circle cx="24" cy="24" r="8" class="icon-primary"/>
            <line x1="24" y1="16" x2="24" y2="20" class="icon-primary"/>
            <line x1="24" y1="28" x2="24" y2="32" class="icon-primary"/>
            <line x1="16" y1="24" x2="20" y2="24" class="icon-primary"/>
            <line x1="28" y1="24" x2="32" y2="24" class="icon-primary"/>
            <rect x="46" y="16" width="140" height="6" rx="3" class="text-line-dark"/>
            <rect x="46" y="28" width="90" height="4" rx="2" class="text-line"/>
        </g>

        <!-- Risk Marker 3 -->
        <g transform="translate(180, 470)">
            <rect x="0" y="0" width="220" height="48" rx="8" class="muted-fill"/>
            <circle cx="24" cy="24" r="8" class="icon-muted"/>
            <rect x="46" y="16" width="110" height="6" rx="3" class="text-line-dark"/>
            <rect x="46" y="28" width="130" height="4" rx="2" class="text-line"/>
        </g>
    </g>

    <!-- CENTER: BROWSER WINDOW SCENARIO -->
    <g id="browser-window">
        <!-- Main Browser Body -->
        <rect x="500" y="220" width="600" height="460" rx="10" class="surface"/>
        
        <!-- Browser Chrome / Top Bar -->
        <path d="M 500 230 A 10 10 0 0 1 510 220 H 1090 A 10 10 0 0 1 1100 230 V 256 H 500 Z" class="bg-alt"/>
        <circle cx="524" cy="238" r="5" fill="var(--text-muted)" opacity="0.4"/>
        <circle cx="544" cy="238" r="5" fill="var(--text-muted)" opacity="0.4"/>
        <circle cx="564" cy="238" r="5" fill="var(--text-muted)" opacity="0.4"/>
        
        <!-- Background Page Content (Muted) -->
        <rect x="540" y="290" width="240" height="24" rx="6" class="muted-fill"/>
        <rect x="540" y="330" width="520" height="140" rx="8" class="muted-fill"/>
        <rect x="540" y="490" width="160" height="120" rx="8" class="muted-fill"/>
        <rect x="720" y="490" width="160" height="120" rx="8" class="muted-fill"/>
        <rect x="900" y="490" width="160" height="120" rx="8" class="muted-fill"/>

        <!-- OVERLAY (BLOCKED BACKGROUND) -->
        <rect x="500" y="256" width="600" height="424" fill="var(--text-main)" opacity="0.15"/>
        
        <!-- Blocked Indicator -->
        <g transform="translate(530, 280)">
            <rect x="0" y="0" width="104" height="32" rx="16" class="surface" filter="url(#shadow-light)"/>
            <circle cx="16" cy="16" r="6" stroke="var(--text-main)" stroke-width="2" fill="none"/>
            <line x1="12" y1="12" x2="20" y2="20" stroke="var(--text-main)" stroke-width="2"/>
            <text x="32" y="21" class="label-pill">Blocked</text>
        </g>

        <!-- MODAL DIALOG -->
        <g transform="translate(650, 320)" filter="url(#shadow)">
            <rect x="0" y="0" width="300" height="220" rx="12" class="surface-flat"/>
            
            <!-- Modal Header -->
            <rect x="24" y="32" width="160" height="14" rx="4" class="text-line-dark"/>
            
            <!-- Modal Body Lines -->
            <rect x="24" y="68" width="252" height="8" rx="4" class="text-line"/>
            <rect x="24" y="90" width="220" height="8" rx="4" class="text-line"/>
            <rect x="24" y="112" width="180" height="8" rx="4" class="text-line"/>
            
            <line x1="0" y1="150" x2="300" y2="150" class="border"/>
            
            <!-- Cancel Button -->
            <rect x="24" y="166" width="110" height="36" rx="6" class="bg-alt"/>
            <rect x="54" y="180" width="50" height="8" rx="4" class="text-line-dark"/>

            <!-- Primary Action Button -->
            <rect x="146" y="166" width="130" height="36" rx="6" fill="var(--primary)"/>
            <rect x="181" y="180" width="60" height="8" rx="4" fill="var(--surface)"/>

            <!-- FOCUS RING -->
            <rect x="140" y="160" width="142" height="48" rx="10" stroke="var(--primary)" stroke-width="2.5" fill="none" stroke-dasharray="6 6"/>
        </g>
        
        <!-- Focus Indicator Pointer -->
        <g transform="translate(850, 560)">
            <!-- Connector line from label to ring -->
            <path d="M 0 0 V -30" stroke="var(--primary)" stroke-width="2" fill="none"/>
            <circle cx="0" cy="-30" r="4" fill="var(--primary)"/>
            <!-- Label Pill -->
            <rect x="-44" y="0" width="88" height="32" rx="16" class="surface" filter="url(#shadow-light)"/>
            <text x="0" y="21" text-anchor="middle" class="label-pill-primary">Focus</text>
        </g>
    </g>

    <!-- RIGHT: BROWSER EVIDENCE PANEL -->
    <g id="evidence-panel">
        <rect x="1180" y="280" width="260" height="340" rx="12" class="surface"/>
        <text x="1310" y="320" text-anchor="middle" class="label-title">Evidence</text>
        <text x="1310" y="342" text-anchor="middle" class="label-sub">Browser</text>
        
        <!-- Evidence Checklist -->
        <!-- Check 1: Trapped Focus -->
        <g transform="translate(1220, 370)">
            <circle cx="12" cy="12" r="12" class="primary-fill"/>
            <polyline points="8,12 11,16 17,8" class="icon-primary" stroke-width="2"/>
            <rect x="36" y="8" width="140" height="8" rx="4" class="text-line-dark"/>
        </g>

        <!-- Check 2: Blocked Background -->
        <g transform="translate(1220, 410)">
            <circle cx="12" cy="12" r="12" class="primary-fill"/>
            <polyline points="8,12 11,16 17,8" class="icon-primary" stroke-width="2"/>
            <rect x="36" y="8" width="160" height="8" rx="4" class="text-line-dark"/>
        </g>

        <!-- Check 3: ARIA state -->
        <g transform="translate(1220, 450)">
            <circle cx="12" cy="12" r="12" class="primary-fill"/>
            <polyline points="8,12 11,16 17,8" class="icon-primary" stroke-width="2"/>
            <rect x="36" y="8" width="110" height="8" rx="4" class="text-line-dark"/>
        </g>

        <!-- Mini Screenshot Evidence Frame -->
        <g transform="translate(1210, 500)">
            <rect x="0" y="0" width="200" height="90" rx="6" class="bg-alt border"/>
            <!-- Tiny browser window inside the screenshot -->
            <rect x="16" y="16" width="168" height="58" rx="4" class="surface"/>
            <line x1="16" y1="26" x2="184" y2="26" class="border"/>
            <circle cx="24" cy="21" r="1.5" fill="var(--text-muted)"/>
            <circle cx="30" cy="21" r="1.5" fill="var(--text-muted)"/>
            
            <!-- Tiny modal representation -->
            <rect x="65" y="38" width="70" height="28" rx="2" class="bg border"/>
            <rect x="100" y="56" width="26" height="6" rx="2" fill="var(--primary)"/>
            <rect x="98" y="54" width="30" height="10" rx="3" stroke="var(--primary)" stroke-width="1" fill="none" stroke-dasharray="2 2"/>
        </g>
    </g>

    <!-- BOTTOM EVIDENCE RUNNER NODE -->
    <g id="bottom-node" transform="translate(1310, 760)">
        <circle cx="0" cy="0" r="30" class="surface"/>
        <circle cx="0" cy="0" r="24" class="border"/>
        <!-- Action/Play Icon -->
        <polygon points="-4,-10 10,0 -4,10" class="icon-muted" stroke-width="2"/>
    </g>

</svg>
