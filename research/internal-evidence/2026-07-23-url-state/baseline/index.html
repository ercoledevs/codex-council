<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Incident Board</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">Operations</p>
        <h1>Incident board</h1>
        <p>Filter the current queue without losing sight of severity.</p>
      </header>

      <form class="filters" aria-label="Incident filters">
        <label>
          Search
          <input id="query" name="query" type="search" autocomplete="off">
        </label>
        <label>
          Status
          <select id="status" name="status">
            <option value="all">All</option>
            <option value="open">Open</option>
            <option value="monitoring">Monitoring</option>
            <option value="resolved">Resolved</option>
          </select>
        </label>
        <button id="reset" type="reset">Reset</button>
      </form>

      <p id="summary" class="summary"></p>
      <ol id="incidents" class="incidents"></ol>
    </main>
    <script src="app.js"></script>
  </body>
</html>
